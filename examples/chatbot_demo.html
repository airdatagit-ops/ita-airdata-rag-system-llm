<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation RAG Chatbot Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .sources {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 12px;
        }

        .sources-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .source-item {
            margin: 3px 0;
            padding: 3px 0;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            width: 60px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #999;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-options {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .chat-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #666;
        }

        .chat-options input[type="checkbox"] {
            cursor: pointer;
        }

        .chat-options input[type="number"] {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>✈️ Aviation RAG Chatbot</h1>
            <p>Assistente especializado em regulamentação de aviação civil brasileira</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-content">
                    Olá! Sou um assistente especializado em regulamentação de aviação civil brasileira. 
                    Como posso ajudá-lo hoje?
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="chat-input-container">
            <div class="chat-options">
                <label>
                    <input type="checkbox" id="useRAG">
                    Usar RAG (busca em regulamentos)
                </label>
                <label>
                    <input type="checkbox" id="useStreaming" checked>
                    Streaming (resposta em tempo real)
                </label>
                <label>
                    Temperatura:
                    <input type="number" id="temperature" min="0" max="1" step="0.1" value="0.7">
                </label>
            </div>
            
            <div class="chat-input-wrapper">
                <input 
                    type="text" 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                >
                <button id="sendButton" class="send-button">Enviar</button>
            </div>
        </div>

        <div class="status" id="status">
            Session ID: <span id="sessionId">Não iniciada</span> | 
            Mensagens: <span id="messageCount">0</span>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://127.0.0.1:8083';
        const API_KEY = 'L2B7zzrla7pV0Ro2Bc5ipwxf3-H8EKwxWz0kX1qMsa0';

        // State
        let sessionId = null;
        let messageCount = 0;

        // Elements
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const useRAGCheckbox = document.getElementById('useRAG');
        const useStreamingCheckbox = document.getElementById('useStreaming');
        const temperatureInput = document.getElementById('temperature');
        const sessionIdSpan = document.getElementById('sessionId');
        const messageCountSpan = document.getElementById('messageCount');

        // Initialize
        document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString();

        // Event listeners
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        // Send message
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message to UI
            addMessage('user', message);
            chatInput.value = '';
            sendButton.disabled = true;

            const useRAG = useRAGCheckbox.checked;
            const useStreaming = useStreamingCheckbox.checked;
            const temperature = parseFloat(temperatureInput.value);

            try {
                if (useStreaming) {
                    await sendStreamingMessage(message, useRAG, temperature);
                } else {
                    await sendRegularMessage(message, useRAG, temperature);
                }
            } catch (error) {
                showError(error.message);
            } finally {
                sendButton.disabled = false;
                chatInput.focus();
            }
        }

        // Regular (non-streaming) message
        async function sendRegularMessage(message, useRAG, temperature) {
            typingIndicator.classList.add('active');
            scrollToBottom();

            const response = await fetch(`${API_BASE_URL}/api/chat`, {
                method: 'POST',
                headers: {
                    'X-API-Key': API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: message,
                    session_id: sessionId,
                    use_rag: useRAG,
                    temperature: temperature,
                    context_window: 10
                })
            });

            typingIndicator.classList.remove('active');

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            
            // Update session
            sessionId = data.session_id;
            messageCount = data.message_count;
            updateStatus();

            // Add assistant message
            addMessage('assistant', data.message, data.sources);
        }

        // Streaming message
        async function sendStreamingMessage(message, useRAG, temperature) {
            typingIndicator.classList.add('active');
            scrollToBottom();

            const response = await fetch(`${API_BASE_URL}/api/chat/stream`, {
                method: 'POST',
                headers: {
                    'X-API-Key': API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: message,
                    session_id: sessionId,
                    use_rag: useRAG,
                    temperature: temperature,
                    context_window: 10
                })
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            typingIndicator.classList.remove('active');

            // Create message container for streaming
            const messageDiv = createMessageElement('assistant', '');
            let fullMessage = '';
            let sources = null;

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const {value, done} = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));

                            if (data.type === 'session') {
                                sessionId = data.session_id;
                                updateStatus();
                            } else if (data.type === 'chunk') {
                                fullMessage += data.content;
                                updateMessageContent(messageDiv, fullMessage);
                                scrollToBottom();
                            } else if (data.type === 'sources') {
                                sources = data.sources;
                            } else if (data.type === 'done') {
                                if (sources) {
                                    addSourcesToMessage(messageDiv, sources);
                                }
                                messageCount++;
                                updateStatus();
                            } else if (data.type === 'error') {
                                showError(data.error);
                            }
                        } catch (e) {
                            console.error('Error parsing SSE data:', e);
                        }
                    }
                }
            }
        }

        // Add message to chat
        function addMessage(role, content, sources = null) {
            const messageDiv = createMessageElement(role, content);
            
            if (sources && sources.length > 0) {
                addSourcesToMessage(messageDiv, sources);
            }

            scrollToBottom();
        }

        // Create message element
        function createMessageElement(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content.replace(/\n/g, '<br>');

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString();

            contentDiv.appendChild(timeDiv);
            messageDiv.appendChild(contentDiv);

            const insertBefore = document.getElementById('typingIndicator');
            chatMessages.insertBefore(messageDiv, insertBefore);

            return messageDiv;
        }

        // Update message content (for streaming)
        function updateMessageContent(messageDiv, content) {
            const contentDiv = messageDiv.querySelector('.message-content');
            const timeDiv = contentDiv.querySelector('.message-time');
            contentDiv.innerHTML = content.replace(/\n/g, '<br>');
            contentDiv.appendChild(timeDiv);
        }

        // Add sources to message
        function addSourcesToMessage(messageDiv, sources) {
            const contentDiv = messageDiv.querySelector('.message-content');
            
            const sourcesDiv = document.createElement('div');
            sourcesDiv.className = 'sources';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'sources-title';
            titleDiv.textContent = '📚 Fontes consultadas:';
            sourcesDiv.appendChild(titleDiv);

            sources.slice(0, 3).forEach((source, i) => {
                const sourceItem = document.createElement('div');
                sourceItem.className = 'source-item';
                sourceItem.textContent = `${i + 1}. ${source.regulation_id} (score: ${source.score?.toFixed(2) || 'N/A'})`;
                sourcesDiv.appendChild(sourceItem);
            });

            contentDiv.insertBefore(sourcesDiv, contentDiv.querySelector('.message-time'));
        }

        // Update status
        function updateStatus() {
            sessionIdSpan.textContent = sessionId ? sessionId.substring(0, 8) + '...' : 'Não iniciada';
            messageCountSpan.textContent = messageCount;
        }

        // Show error
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = `❌ Erro: ${message}`;
            chatMessages.appendChild(errorDiv);
            scrollToBottom();

            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Focus input on load
        window.addEventListener('load', () => {
            chatInput.focus();
        });
    </script>
</body>
</html>
