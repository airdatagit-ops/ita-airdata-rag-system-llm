# ========================================
# Aviation RAG System - Docker Compose Completo
# ========================================
# Este docker-compose configura todos os serviços necessários:
# - Qdrant (banco vetorial)
# - API RAG (backend Python com embeddings + LLM)
# - Web App (interface do usuário)
# 
# Uso:
#   docker-compose -f docker-compose.unified.yml up -d
#   docker-compose -f docker-compose.unified.yml logs -f
#   docker-compose -f docker-compose.unified.yml down
# ========================================

services:
  # ========================================
  # Qdrant Vector Database
  # ========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aviation-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aviation-rag-network

  # ========================================
  # API RAG - Backend Principal
  # (Embeddings + LLM + Busca Vetorial)
  # ========================================
  api-rag:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aviation-api-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Volume para documentos normativos (originais e JSONs extraídos)
      - documents_data:/app/data
      # Cache de modelos de embedding (para não re-baixar)
      - models_cache:/app/models_cache
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEY=${API_KEY:-development-key-change-me}
      - API_TITLE=Aviation RAG API
      - API_VERSION=1.0.0
      - API_DESCRIPTION=Retrieval-Augmented Generation API for Brazilian Aviation Regulations
      - RELOAD=false
      
      # Qdrant Configuration
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-aviation_regulations}
      
      # Ollama Configuration (rodando no host ou em container separado)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      
      # LLM Parameters
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-500}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      
      # Embedding Model
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-rufimelo/Legal-BERTimbau-sts-large-ma-v3}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - EMBEDDING_MAX_LENGTH=${EMBEDDING_MAX_LENGTH:-512}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
      - MODEL_CACHE_DIR=/app/models_cache
      
      # Search Configuration
      - SEARCH_TOP_K=${SEARCH_TOP_K:-5}
      - SEARCH_SCORE_THRESHOLD=${SEARCH_SCORE_THRESHOLD:-0.3}
      - SEARCH_TIMEOUT=${SEARCH_TIMEOUT:-10}
      
      # HNSW Parameters
      - HNSW_M=${HNSW_M:-16}
      - HNSW_EF_CONSTRUCT=${HNSW_EF_CONSTRUCT:-100}
      - HNSW_EF_SEARCH=${HNSW_EF_SEARCH:-64}
      
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8001,http://web-app:8001}
      
      # Rate Limiting
      - RATE_LIMIT=${RATE_LIMIT:-100}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
      
      # Data paths
      - DATA_DIR=/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Tempo extra para carregar modelos de embedding
    networks:
      - aviation-rag-network
    # Descomente para usar GPU (requer nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ========================================
  # Web Application - Interface do Usuário
  # ========================================
  web-app:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aviation-web-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # Volume para histórico de chats
      - chat_history:/app/chat_history
    environment:
      # Web Server Config
      - HOST=0.0.0.0
      - PORT=8001
      - RELOAD=false
      
      # API RAG Connection
      - API_BASE_URL=http://api-rag:8000
      - API_KEY=${API_KEY:-development-key-change-me}
      
      # Application Info
      - APP_NAME=Aviation RAG Web Interface
      - APP_VERSION=1.0.0
    depends_on:
      api-rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aviation-rag-network

  # ========================================
  # Ollama (Opcional - LLM Local em Container)
  # Descomente se quiser rodar Ollama no Docker
  # Requer GPU NVIDIA
  # ========================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: aviation-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - aviation-rag-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

# ========================================
# Networks
# ========================================
networks:
  aviation-rag-network:
    driver: bridge
    name: aviation-rag-network

# ========================================
# Volumes
# ========================================
volumes:
  # Armazenamento do Qdrant (vetores indexados)
  qdrant_storage:
    driver: local
    name: aviation-qdrant-storage
  
  # Documentos normativos (originais e JSONs extraídos)
  # Mapeado para /app/data no container api-rag
  documents_data:
    driver: local
    name: aviation-documents-data
  
  # Cache de modelos de embedding
  models_cache:
    driver: local
    name: aviation-models-cache
  
  # Histórico de conversas do chatbot
  # Mapeado para /app/chat_history no container web-app
  chat_history:
    driver: local
    name: aviation-chat-history
  
  # Volume do Ollama (se usar container)
  # ollama_data:
  #   driver: local
  #   name: aviation-ollama-data
