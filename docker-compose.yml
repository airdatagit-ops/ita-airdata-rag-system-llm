services:
  # ========================================
  # Qdrant Vector Database
  # ========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Performance settings
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aviation-rag-network

  # ========================================
  # API RAG - Backend (Busca Vetorial + LLM)
  # Este é o seu backend Python que você já tem
  # ========================================
  api-rag:
    build:
      context: ./api  # Diretório com seu código da API (server.py, auth.py, etc)
      dockerfile: Dockerfile
    container_name: aviation-api-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Configurações da API RAG
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEY=${API_KEY}  # Defina no .env
      - RELOAD=False
      
      # Qdrant Configuration
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-aviation_regulations}
      
      # LLM Configuration (ajuste conforme seu setup)
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}  # ollama, openai, anthropic, etc
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}  # Se Ollama estiver no host
      # ou OLLAMA_URL=http://ollama:11434 se usar container
      
      # OpenAI (se usar)
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Rate Limiting
      - RATE_LIMIT=${RATE_LIMIT:-10}
      
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8001,https://seu-dominio.com}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aviation-rag-network
    # Se precisar acessar GPU para LLM local
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ========================================
  # Web Application - Interface do Usuário
  # Este é o frontend web que criamos
  # ========================================
  web-app:
    build:
      context: ./web  # Diretório com a aplicação web que criamos
      dockerfile: Dockerfile
    container_name: aviation-web-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Web Server Config
      - HOST=0.0.0.0
      - PORT=8001
      - RELOAD=False
      
      # API RAG Connection
      - API_BASE_URL=http://api-rag:8000
      - API_KEY=${API_KEY}
      
      # Application Info
      - APP_NAME=Aviation RAG Web Interface
      - APP_VERSION=1.0.0
    depends_on:
      api-rag:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aviation-rag-network

  # ========================================
  # Ollama (Optional - para LLM local)
  # Descomente se quiser rodar Ollama no Docker
  # Requer GPU NVIDIA
  # ========================================
  # ollama:
  #   image: ollama/ollama:latest
