  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - aviation-rag-network
  #   command: serve

  # ========================================
  # Redis Cache (Optional - para cache)
  # ========================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: aviation-redis-cache
  #   restart: unless-stopped
