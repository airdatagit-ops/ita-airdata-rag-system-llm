  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - aviation-rag-network

  # ========================================
  # Nginx Reverse Proxy (Optional - para produção)
  # ========================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: aviation-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
