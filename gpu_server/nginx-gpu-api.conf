# GPU Inference Server — nginx location blocks
# Include this file inside an existing server block:
#   include /etc/nginx/sites-available/gpu-api;
#
# This snippet ONLY adds location blocks and does NOT create a new
# server block, so it can be safely included in any existing virtual
# host without conflicting with other server_name directives.

# --- GPU Inference API (port 8090) ---

location /gpu-api/ {
    proxy_pass http://127.0.0.1:8090/;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_redirect off;

    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    client_max_body_size 50m;

    # SSE streaming support (for /v1/generate/stream)
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
}

# --- Ollama API (port 11434) --- optional, for direct Ollama access

location /ollama-api/ {
    proxy_pass http://127.0.0.1:11434/;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_redirect off;

    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    client_max_body_size 50m;

    proxy_buffering off;
    proxy_set_header Connection "";
}
