# RAG System — nginx location blocks
# Include this file inside an existing server block:
#   include /etc/nginx/sites-available/rag;

# --- RAG API (port 8083) ---

location /ragapi {
    return 302 /ragapi/;
}

location /ragapi/ {
    proxy_pass http://127.0.0.1:8083/;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_redirect off;

    proxy_read_timeout    180s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    180s;

    # SSE support for chat streaming
    proxy_buffering off;
    proxy_cache off;
}

# --- Datasette Explorer (port 8001) ---

location /explore/ {
    proxy_pass http://127.0.0.1:8001/explore/;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_redirect off;
}
