version: '3.8'

services:
  web:
    build: .
    container_name: aviation-rag-web
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - RELOAD=False
      - API_BASE_URL=${API_BASE_URL:-http://api-rag:8000}
      - API_KEY=${API_KEY}
    env_file:
      - .env
    depends_on:
      - api-rag
    restart: unless-stopped
    networks:
      - aviation-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API RAG service (exemplo - ajuste conforme necessário)
  api-rag:
    image: your-registry/aviation-rag-api:latest
    container_name: aviation-rag-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - API_KEY=${API_KEY}
    env_file:
      - .env
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - aviation-network

  # Qdrant vector database (exemplo)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aviation-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - aviation-network

networks:
  aviation-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
