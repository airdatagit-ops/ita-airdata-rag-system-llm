name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          echo "========================================="
          echo "  Deploying branch: $BRANCH"
          echo "========================================="
          cd ~/ita-airdata-rag-system-llm
          git fetch origin
          git checkout "$BRANCH"
          sudo bash deploy/deploy.sh
