name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    # Pinned to label "app" to disambiguate from the GPU runner used by
    # ita-airdata-gpu-proxy-server (label "gpu"). Re-register the
    # airdatasrv02 runner with labels self-hosted,app,linux,x64.
    runs-on: [self-hosted, app]
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          echo "========================================="
          echo "  Deploying branch: $BRANCH"
          echo "========================================="
          PROJECT_DIR="/home/jean/ita-airdata-rag-system-llm"
          cd "$PROJECT_DIR"
          git fetch origin
          git checkout "$BRANCH"
          sudo /usr/bin/bash "$PROJECT_DIR/deploy/deploy.sh"
