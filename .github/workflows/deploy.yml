name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    # Pinned to label "app" to disambiguate from the GPU runner used by
    # ita-airdata-gpu-proxy-server (label "gpu"). Re-register the
    # airdatasrv02 runner with labels self-hosted,app,linux,x64.
    runs-on: [self-hosted, app]
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy
        env:
          AUTH_MODE: ${{ secrets.AUTH_MODE }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          DRUPAL_OAUTH_BASE_URL: ${{ secrets.DRUPAL_OAUTH_BASE_URL }}
          DRUPAL_OAUTH_CLIENT_ID: ${{ secrets.DRUPAL_OAUTH_CLIENT_ID }}
          DRUPAL_OAUTH_CLIENT_SECRET: ${{ secrets.DRUPAL_OAUTH_CLIENT_SECRET }}
          DRUPAL_OAUTH_AUTHORIZE_URL: ${{ secrets.DRUPAL_OAUTH_AUTHORIZE_URL }}
          DRUPAL_OAUTH_TOKEN_URL: ${{ secrets.DRUPAL_OAUTH_TOKEN_URL }}
          DRUPAL_OAUTH_INTROSPECTION_URL: ${{ secrets.DRUPAL_OAUTH_INTROSPECTION_URL }}
          DRUPAL_OAUTH_USERINFO_URL: ${{ secrets.DRUPAL_OAUTH_USERINFO_URL }}
          DRUPAL_OAUTH_SCOPES: ${{ secrets.DRUPAL_OAUTH_SCOPES }}
          DRUPAL_OAUTH_CALLBACK_PATH: ${{ secrets.DRUPAL_OAUTH_CALLBACK_PATH }}
          DRUPAL_OAUTH_REDIRECT_URI: ${{ secrets.DRUPAL_OAUTH_REDIRECT_URI }}
          WEB_LOGIN_ENABLED: ${{ secrets.WEB_LOGIN_ENABLED }}
          WEB_LOGIN_USERNAME: ${{ secrets.WEB_LOGIN_USERNAME }}
          WEB_LOGIN_PASSWORD: ${{ secrets.WEB_LOGIN_PASSWORD }}
          WEB_LOGIN_TOKEN_TTL_SECONDS: ${{ secrets.WEB_LOGIN_TOKEN_TTL_SECONDS }}
          WEB_LOGIN_COOKIE_NAME: ${{ secrets.WEB_LOGIN_COOKIE_NAME }}
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          echo "========================================="
          echo "  Deploying branch: $BRANCH"
          echo "========================================="
          PROJECT_DIR="/home/jean/ita-airdata-rag-system-llm"
          DEPLOY_ENV_FILE="/tmp/airdata-rag-deploy-env"

          umask 077
          : > "$DEPLOY_ENV_FILE"
          write_secret_env() {
            local key="$1"
            local value="${!key-}"
            if [ -n "$value" ]; then
              printf '%s=%q\n' "$key" "$value" >> "$DEPLOY_ENV_FILE"
            fi
          }
          for key in \
            AUTH_MODE \
            SESSION_SECRET_KEY \
            SESSION_COOKIE_SECURE \
            DRUPAL_OAUTH_BASE_URL \
            DRUPAL_OAUTH_CLIENT_ID \
            DRUPAL_OAUTH_CLIENT_SECRET \
            DRUPAL_OAUTH_AUTHORIZE_URL \
            DRUPAL_OAUTH_TOKEN_URL \
            DRUPAL_OAUTH_INTROSPECTION_URL \
            DRUPAL_OAUTH_USERINFO_URL \
            DRUPAL_OAUTH_SCOPES \
            DRUPAL_OAUTH_CALLBACK_PATH \
            DRUPAL_OAUTH_REDIRECT_URI \
            WEB_LOGIN_ENABLED \
            WEB_LOGIN_USERNAME \
            WEB_LOGIN_PASSWORD \
            WEB_LOGIN_TOKEN_TTL_SECONDS \
            WEB_LOGIN_COOKIE_NAME; do
            write_secret_env "$key"
          done

          cd "$PROJECT_DIR"
          git fetch origin
          git checkout "$BRANCH"
          sudo /usr/bin/bash "$PROJECT_DIR/deploy/deploy.sh"
